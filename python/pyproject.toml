[project]
name = "cad-service"
version = "0.1.0"
description = "CAD sidecar service: DXF parsing, validation and drawing tools"
requires-python = ">=3.12"
dependencies = [
    "ezdxf>=1.3",
    "pypdf>=5",
    "python-docx>=1.1",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
